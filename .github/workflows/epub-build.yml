
name: Build Minecraft Bedrock Add-on Reference EPUB

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * 1"

  push:
    paths:
      - ".github/workflows/build-epub.yml"

permissions:
  contents: read

concurrency:
  group: minecraft-addon-epub
  cancel-in-progress: true

jobs:
  build:
    name: Build EPUB 3 Reference
    runs-on: ubuntu-latest

    steps:
      # Check out the repository containing this workflow.
      - name: Check out builder repository
        uses: actions/checkout@v7

      # Check out the official Microsoft documentation.
      - name: Check out official Minecraft Creator documentation
        uses: actions/checkout@v7
        with:
          repository: MicrosoftDocs/minecraft-creator
          path: minecraft-creator
          fetch-depth: 1

      # Pandoc is often already installed on GitHub-hosted runners.
      # Install it only if it is missing. No Java or EPUBCheck.
      - name: Check Pandoc installation
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            echo "Pandoc is missing. Installing Pandoc only..."
            sudo apt-get update
            sudo apt-get install -y pandoc
          fi

          pandoc --version
          python3 --version

      - name: Build EPUB
        shell: bash
        run: |
          cat > build_epub.py <<'PY'
          from pathlib import Path
          import re
          import json
          import shutil
          import subprocess
          import sys
          from datetime import datetime, timezone
          from urllib.parse import unquote

          ROOT = Path.cwd()
          CREATOR = ROOT / "minecraft-creator" / "creator"
          BUILD = ROOT / "epub-build"
          MARKDOWN_DIR = BUILD / "markdown"
          AUDIT_DIR = ROOT / "build-audit"

          OUTPUT = ROOT / "Minecraft_Bedrock_Addon_Complete_Reference.epub"

          TITLE = "Minecraft Bedrock Add-on Development: Complete Reference"
          AUTHOR = "Compiled from official Microsoft Minecraft Creator documentation"

          REPOSITORY_URL = "https://github.com/MicrosoftDocs/minecraft-creator"
          DOCUMENTATION_URL = "https://learn.microsoft.com/en-us/minecraft/creator/"

          EXCLUDED_DIRECTORY_NAMES = {
              "preview",
              "experimental",
              "beta",
          }

          EXCLUDED_FILENAME_ENDINGS = (
              "-preview.md",
              "-beta.md",
          )

          SEARCH_ROOTS = [
              CREATOR / "Documents",
              CREATOR / "Reference",
              CREATOR / "ScriptAPI",
          ]

          def fail(message):
              print(f"ERROR: {message}", file=sys.stderr)
              sys.exit(1)

          def clean_frontmatter(content):
              if not content.startswith("---"):
                  return content, ""

              match = re.match(
                  r"\A---\s*\n(.*?)\n---\s*\n?",
                  content,
                  flags=re.DOTALL
              )

              if not match:
                  return content, ""

              return content[match.end():], match.group(1)

          def extract_title(content, frontmatter, path):
              title_match = re.search(
                  r"(?m)^title:\s*[\"']?(.+?)[\"']?\s*$",
                  frontmatter
              )

              if title_match:
                  return title_match.group(1).strip().strip("\"'")

              heading_match = re.search(
                  r"(?m)^#\s+(.+?)\s*$",
                  content
              )

              if heading_match:
                  return heading_match.group(1).strip()

              return path.stem.replace("-", " ").replace("_", " ").title()

          def is_stable_document(path):
              relative = path.relative_to(CREATOR)
              parts = {part.lower() for part in relative.parts}

              if parts & EXCLUDED_DIRECTORY_NAMES:
                  return False

              if path.name.lower().endswith(EXCLUDED_FILENAME_ENDINGS):
                  return False

              return True

          def collect_documents():
              documents = []

              for search_root in SEARCH_ROOTS:
                  if not search_root.exists():
                      print(f"Notice: {search_root} does not exist.")
                      continue

                  for path in search_root.rglob("*.md"):
                      if not is_stable_document(path):
                          continue

                      documents.append(path)

              # Keep sections grouped in a predictable order.
              documents.sort(
                  key=lambda p: (
                      p.relative_to(CREATOR).parts[0].lower(),
                      str(p.relative_to(CREATOR)).lower()
                  )
              )

              # Remove duplicate paths while preserving order.
              return list(dict.fromkeys(documents))

          def rewrite_images(content, source_path, remote_images):
              image_pattern = re.compile(
                  r'(!\[[^\]]*\]\()<?([^)\s>]+)>?(\))'
              )

              def replace(match):
                  prefix, target, suffix = match.groups()

                  if target.startswith(("http://", "https://", "data:")):
                      remote_images.add(target)
                      return match.group(0)

                  if target.startswith("file:"):
                      return match.group(0)

                  clean_target = unquote(target.split("#")[0].split("?")[0])

                  if not clean_target:
                      return match.group(0)

                  candidates = [
                      source_path.parent / clean_target,
                      CREATOR / clean_target,
                      ROOT / clean_target,
                  ]

                  for candidate in candidates:
                      try:
                          resolved = candidate.resolve()
                          if resolved.is_file():
                              return f"{prefix}<{resolved}>{suffix}"
                      except (OSError, RuntimeError):
                          continue

                  return match.group(0)

              return image_pattern.sub(replace, content)

          def rewrite_markdown_links(content, source_path):
              pattern = re.compile(
                  r'(\]\()<?([^)\s>]+)>?(\))'
              )

              def replace(match):
                  prefix, target, suffix = match.groups()

                  if target.startswith((
                      "http://",
                      "https://",
                      "mailto:",
                      "#",
                      "data:"
                  )):
                      return match.group(0)

                  path_part, separator, anchor = target.partition("#")

                  if not path_part.lower().endswith(".md"):
                      return match.group(0)

                  decoded = unquote(path_part)

                  candidates = [
                      source_path.parent / decoded,
                      CREATOR / decoded,
                  ]

                  resolved = None

                  for candidate in candidates:
                      try:
                          candidate = candidate.resolve()
                          if candidate.is_file() and candidate.is_relative_to(CREATOR.resolve()):
                              resolved = candidate
                              break
                      except (OSError, RuntimeError):
                          continue

                  if resolved is None:
                      return match.group(0)

                  relative = resolved.relative_to(CREATOR)
                  learn_path = str(relative.with_suffix("")).replace("\\", "/").lower()

                  url = DOCUMENTATION_URL.rstrip("/") + "/" + learn_path

                  if separator:
                      url += "#" + anchor

                  return f"{prefix}{url}{suffix}"

              return pattern.sub(replace, content)

          def create_css():
              return """
          body {
              font-family: sans-serif;
              line-height: 1.55;
          }

          h1, h2, h3, h4 {
              line-height: 1.25;
              page-break-after: avoid;
          }

          h1 {
              font-size: 1.8em;
              margin-top: 0;
          }

          h2 {
              font-size: 1.4em;
              margin-top: 1.5em;
          }

          p {
              margin: 0.65em 0;
          }

          pre {
              background: #20242b;
              color: #e6edf3;
              padding: 0.9em;
              border-radius: 5px;
              white-space: pre-wrap;
              overflow-wrap: anywhere;
              font-size: 0.82em;
          }

          code {
              font-family: monospace;
              overflow-wrap: anywhere;
          }

          :not(pre) > code {
              background: #eeeeee;
              padding: 0.12em 0.3em;
              border-radius: 3px;
          }

          table {
              border-collapse: collapse;
              width: 100%;
              font-size: 0.85em;
          }

          th, td {
              border: 1px solid #999999;
              padding: 0.4em;
              vertical-align: top;
          }

          th {
              background: #eeeeee;
          }

          img {
              max-width: 100%;
              height: auto;
          }

          blockquote {
              border-left: 3px solid #888888;
              margin-left: 0.5em;
              padding-left: 1em;
          }

          a {
              overflow-wrap: anywhere;
          }
          """

          def create_attribution():
              return f"""
          # Documentation sources and attribution

          This reference is compiled from the official Minecraft Creator
          documentation maintained by Microsoft.

          **Official documentation:** {DOCUMENTATION_URL}

          **Source repository:** {REPOSITORY_URL}

          The source repository contains material distributed under its
          respective licenses, including Creative Commons Attribution 4.0
          International (CC BY 4.0) and MIT-licensed material.

          Original authorship and licensing remain with their respective
          copyright holders. This compiled EPUB is not an official Microsoft
          publication.

          This compilation may contain omissions or formatting differences
          introduced during conversion from the original documentation.

          Generated: {datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}
          """

          def main():
              if not CREATOR.exists():
                  fail(
                      "Official documentation checkout is missing. "
                      "Expected minecraft-creator/creator."
                  )

              shutil.rmtree(BUILD, ignore_errors=True)
              shutil.rmtree(AUDIT_DIR, ignore_errors=True)

              MARKDOWN_DIR.mkdir(parents=True, exist_ok=True)
              AUDIT_DIR.mkdir(parents=True, exist_ok=True)

              documents = collect_documents()

              if not documents:
                  fail("No stable Markdown documentation files were found.")

              print(f"Found {len(documents)} Markdown documents.")

              remote_images = set()
              manifest = []
              combined_sections = []

              for index, path in enumerate(documents, start=1):
                  print(f"[{index}/{len(documents)}] {path.relative_to(CREATOR)}")

                  try:
                      raw = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      raw = path.read_text(encoding="utf-8", errors="replace")

                  content, frontmatter = clean_frontmatter(raw)
                  title = extract_title(content, frontmatter, path)

                  content = rewrite_images(content, path, remote_images)
                  content = rewrite_markdown_links(content, path)

                  # Avoid duplicating the document's first heading.
                  content = re.sub(
                      r"(?m)^#\s+" + re.escape(title) + r"\s*\n+",
                      "",
                      content,
                      count=1,
                      flags=re.IGNORECASE
                  )

                  relative = path.relative_to(CREATOR).as_posix()

                  combined_sections.append(
                      f"\n\n# {title}\n\n"
                      f"<!-- Source: {relative} -->\n\n"
                      f"{content.strip()}\n"
                  )

                  manifest.append({
                      "title": title,
                      "source": relative,
                  })

              combined_sections.append(create_attribution())

              combined_file = MARKDOWN_DIR / "complete-reference.md"
              combined_file.write_text(
                  "\n\n".join(combined_sections),
                  encoding="utf-8"
              )

              css_file = BUILD / "epub.css"
              css_file.write_text(create_css(), encoding="utf-8")

              manifest_file = AUDIT_DIR / "source-manifest.json"
              manifest_file.write_text(
                  json.dumps(manifest, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

              remote_file = AUDIT_DIR / "remote-images.txt"
              remote_file.write_text(
                  "\n".join(sorted(remote_images)),
                  encoding="utf-8"
              )

              command = [
                  "pandoc",
                  str(combined_file),
                  "--from=gfm",
                  "--to=epub3",
                  "--standalone",
                  "--toc",
                  "--toc-depth=4",
                  "--epub-chapter-level=1",
                  "--syntax-highlighting=espresso",
                  f"--css={css_file}",
                  f"--metadata=title:{TITLE}",
                  f"--metadata=author:{AUTHOR}",
                  "--metadata=lang:en-US",
                  "--metadata=subject:Minecraft Bedrock Add-on Development",
                  "--metadata=description:Comprehensive reference compiled from official Minecraft Creator documentation.",
                  f"--resource-path=.:{CREATOR}",
                  f"--output={OUTPUT}",
              ]

              print("Generating EPUB 3...")
              subprocess.run(command, check=True)

              if not OUTPUT.exists() or OUTPUT.stat().st_size == 0:
                  fail("Pandoc did not produce a valid output file.")

              size_mb = OUTPUT.stat().st_size / (1024 * 1024)

              report = {
                  "title": TITLE,
                  "output": OUTPUT.name,
                  "size_bytes": OUTPUT.stat().st_size,
                  "size_megabytes": round(size_mb, 2),
                  "documents_included": len(documents),
                  "remote_images_not_embedded": len(remote_images),
                  "generated_utc": datetime.now(timezone.utc).isoformat(),
                  "source_repository": REPOSITORY_URL,
                  "validation": "Not EPUBCheck-validated. Use Draft2Digital manually.",
              }

              report_file = AUDIT_DIR / "build-report.json"
              report_file.write_text(
                  json.dumps(report, indent=2),
                  encoding="utf-8"
              )

              summary = f"""# Minecraft Bedrock Add-on Reference

          **Build successful**

          - Output: `{OUTPUT.name}`
          - Size: {size_mb:.2f} MB
          - Markdown documents included: {len(documents)}
          - Remote images not embedded: {len(remote_images)}
          - EPUB format: EPUB 3
          - EPUBCheck: Not run

          ## Manual EPUB validation

          1. Download the EPUB artifact from this workflow run.
          2. Open [Draft2Digital EPUB Validator](https://draft2digital.com/book/epubcheck/upload).
          3. Upload the EPUB.
          4. Review any errors or warnings reported by the validator.

          ## Important

          This build collects stable Markdown documentation under the
          official Documents, Reference, and ScriptAPI directories.
          Preview, experimental, and beta directory content is excluded.

          Remote images are listed in `remote-images.txt` and are not
          guaranteed to be available offline.
          """

              with open(
                  __import__("os").environ["GITHUB_STEP_SUMMARY"],
                  "a",
                  encoding="utf-8"
              ) as file:
                  file.write(summary)

              print()
              print("EPUB BUILD SUCCESSFUL")
              print(f"Output: {OUTPUT}")
              print(f"Size: {size_mb:.2f} MB")
              print(f"Documents: {len(documents)}")
              print(f"Remote images: {len(remote_images)}")

          if __name__ == "__main__":
              main()
          PY

          python3 build_epub.py

      # Upload the actual EPUB as its own artifact.
      - name: Upload EPUB
        uses: actions/upload-artifact@v7
        with:
          name: Minecraft-Bedrock-Addon-Complete-Reference
          path: Minecraft_Bedrock_Addon_Complete_Reference.epub
          if-no-files-found: error
          retention-days: 30

      # Upload the source manifest and build report separately.
      - name: Upload build audit files
        uses: actions/upload-artifact@v7
        with:
          name: Minecraft-Bedrock-Addon-Build-Report
          path: build-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Final build summary
        if: always()
        run: |
          echo "Java installation: skipped"
          echo "EPUBCheck installation: skipped"
          echo "Manual validator: https://draft2digital.com/book/epubcheck/upload"
